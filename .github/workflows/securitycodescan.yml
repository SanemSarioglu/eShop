name: SecurityCodeScan

on: [push, pull_request]

jobs:
  securitycodescan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build with SecurityCodeScan
        run: dotnet build security-test/SecurityCodeScanTest/SecurityCodeScanTest.csproj /p:ErrorLog=securitycodescan-results.sarif

      - name: Upload results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: securitycodescan-results.sarif
